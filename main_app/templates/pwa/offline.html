<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5e64ff">
  <title>Offline - {{ college }}</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f5fb; color: #1f2430; }
    main { max-width: 420px; width: 100%; background: #fff; border-radius: 16px; padding: 28px 24px; text-align: center;
           box-shadow: 0 2px 14px rgba(40, 50, 90, .12); }
    .mark { width: 72px; height: 72px; border-radius: 18px; background: #5e64ff; margin: 0 auto 16px; display: block; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { line-height: 1.5; margin: 8px 0; color: #4a5163; }
    button { margin-top: 18px; width: 100%; padding: 14px; font-size: 1rem; font-weight: 600; border: 0; border-radius: 10px;
             background: #5e64ff; color: #fff; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/static/pwa/icon-192.png" alt="">
    <h1>You are offline</h1>
    <p>{{ college }} needs an internet connection to show or save anything.</p>
    <p><strong>Nothing you were doing has been saved.</strong> Reconnect, then open the page again and repeat it.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
